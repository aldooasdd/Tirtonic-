<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>Tirtonic String Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --green: #006039; --green-deep: #004A2C; --green-ink: #00341F;
  --accent-text: #006039; --tint: #EEF5F1; --tint-2: #D5E7DC; --tint-3: #B2D3C0;
  --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F5F8F6; --ink: #15201A; --muted: #56655D; --line: #E1E8E4;
  --on-green: #FFFFFF; --warn: #8A5A00;
  --r-lg: 18px; --r: 12px; --r-sm: 8px;
  --shadow: 0 1px 2px rgba(0,52,31,.06), 0 10px 30px rgba(0,52,31,.07);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --green: #0B6B43; --green-deep: #004A2C; --accent-text: #72CFA2; --tint: #12261C; --tint-2: #1C3B2B; --tint-3: #2A5641;
    --bg: #0B1410; --surface: #111D17; --surface-2: #15241C; --ink: #E7F0EA; --muted: #9EB4A7; --line: #22352B; --warn: #E8B45A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --green: #0B6B43; --green-deep: #004A2C; --accent-text: #72CFA2; --tint: #12261C; --tint-2: #1C3B2B; --tint-3: #2A5641;
  --bg: #0B1410; --surface: #111D17; --surface-2: #15241C; --ink: #E7F0EA; --muted: #9EB4A7; --line: #22352B; --warn: #E8B45A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--tint-3); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* stringbed pattern: benang senar tipis bersilang */
.strings { background-color: var(--green-deep);
  background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.075) 0 1px, transparent 1px 26px),
                    repeating-linear-gradient(0deg, rgba(255,255,255,.075) 0 1px, transparent 1px 26px); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 24px;
  border-radius: 999px; border: 1.5px solid transparent; font-weight: 700; font-size: 16px; letter-spacing: .005em; text-decoration: none;
  transition: background-color .15s, border-color .15s, color .15s; }
.btn-primary { background: var(--green); color: var(--on-green); }
.btn-primary:hover { background: var(--green-deep); }
.btn-outline { background: transparent; color: var(--accent-text); border-color: var(--tint-3); }
.btn-outline:hover { background: var(--tint); border-color: var(--accent-text); }
.btn-ghost { background: transparent; color: var(--accent-text); padding: 0 14px; min-height: 44px; }
.btn-ghost:hover { background: var(--tint); }
.btn-lg { min-height: 60px; font-size: 17px; padding: 0 32px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* header */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--green); color: #fff; }
.hdr-in { max-width: 1160px; margin: 0 auto; height: 64px; padding: 0 20px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.wordmark { font-weight: 800; letter-spacing: .3em; font-size: 15px; }
.brand-sep { width: 1px; height: 22px; background: rgba(255,255,255,.35); }
.brand-sub { font-weight: 500; font-size: 15px; opacity: .92; white-space: nowrap; }
.hdr-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.hdr-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px;
  background: transparent; border: 1px solid rgba(255,255,255,.28); color: #fff; font-weight: 600; font-size: 14px; }
.hdr-btn:hover { background: rgba(255,255,255,.1); }
.hdr-btn.plain { border-color: transparent; }
@media (max-width: 560px) { .brand-sub, .brand-sep, .hdr-btn .t-hide { display: none; } }

main { outline: none; }
.screen { animation: in .18s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } * { transition: none !important; } }
.wrap { max-width: 1160px; margin: 0 auto; padding: 32px 20px 64px; }
.narrow { max-width: 640px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* login */
.login { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: 1fr; }
.login-art { color: #fff; padding: 28px 28px 32px; display: flex; flex-direction: column; justify-content: space-between; min-height: 280px; }
.login-art .wordmark { font-size: 17px; }
.login-art .tag { font-size: 14px; opacity: .8; margin-top: 4px; letter-spacing: .02em; }
.login-art h2 { font-size: clamp(30px, 5vw, 52px); line-height: 1.08; font-weight: 800; letter-spacing: -.02em; max-width: 12ch; }
.login-art p { margin-top: 14px; max-width: 36ch; opacity: .88; }
.login-form { display: flex; align-items: center; justify-content: center; padding: 40px 24px; background: var(--bg); }
.login-card { width: 100%; max-width: 400px; }
.login-card h1 { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
.field { margin-top: 28px; }
.field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
.pw { position: relative; }
.pw input { width: 100%; height: 56px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface);
  padding: 0 56px 0 16px; font-size: 17px; }
.pw input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px var(--tint); }
.pw input[aria-invalid="true"] { border-color: #B3261E; }
.pw .eye { position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: var(--muted);
  display: grid; place-items: center; }
.err { color: #B3261E; font-size: 14px; margin-top: 8px; min-height: 20px; font-weight: 500; }
:root[data-theme="dark"] .err, :root[data-theme="dark"] .pw input[aria-invalid="true"] { color: #FF8A80; border-color: #FF8A80; }
.demo { margin-top: 24px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); font-size: 14px; color: var(--muted); }
@media (min-width: 900px) {
  .login { grid-template-columns: 1.05fr 1fr; }
  .login-art { padding: 48px 56px 56px; min-height: 100vh; min-height: 100dvh; }
}

/* branch */
.center-card { max-width: 560px; margin: 0 auto; }
.eyebrow-step { color: var(--muted); font-weight: 600; font-size: 14px; }
.title { font-size: clamp(26px, 3.6vw, 34px); line-height: 1.2; font-weight: 800; letter-spacing: -.015em; }

/* options */
.opts { display: grid; gap: 12px; margin-top: 28px; }
.opt { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 72px; padding: 14px 18px; text-align: left;
  border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); transition: border-color .15s, background-color .15s; }
.opt:hover { border-color: var(--tint-3); }
.opt[aria-pressed="true"] { border-color: var(--green); background: var(--tint); }
.opt[disabled] { opacity: .45; cursor: not-allowed; }
.opt-txt { flex: 1; min-width: 0; }
.opt-label { display: block; font-weight: 700; font-size: 17px; }
.opt-hint { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.mark { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--tint-3); flex: none; display: grid; place-items: center;
  font-weight: 800; font-size: 13px; color: var(--on-green); }
.opt[aria-pressed="true"] .mark { background: var(--green); border-color: var(--green); }
.mark svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 3; fill: none; }

/* question chrome */
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 6px; border: 0; background: transparent;
  color: var(--accent-text); font-weight: 600; border-radius: 999px; }
.back:hover { background: var(--tint); }
.progress { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-bottom: 36px; }
.progress > span { display: block; height: 100%; background: var(--green); border-radius: 4px; transition: width .25s ease; }
.helper { margin-top: 10px; color: var(--muted); }
.conflict { margin-top: 16px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); font-size: 14px; display: flex; gap: 10px; }
.qnext { margin-top: 28px; }
@media (max-width: 640px) {
  .qnext { position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
}

/* home */
.home { display: grid; gap: 40px; align-items: center; padding-top: 24px; }
.home h1 { font-size: clamp(34px, 5.2vw, 58px); line-height: 1.06; font-weight: 800; letter-spacing: -.025em; max-width: 14ch; }
.home .lead { margin-top: 18px; font-size: 18px; color: var(--muted); max-width: 46ch; }
.home .cta { margin-top: 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.steps { border-radius: var(--r-lg); padding: 28px; color: #fff; }
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; counter-increment: s; }
.steps li::before { content: counter(s); width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--green-deep);
  display: grid; place-items: center; font-weight: 800; }
.steps b { display: block; font-size: 17px; }
.steps span { opacity: .85; font-size: 15px; }
.facts { margin-top: 26px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.2); display: flex; gap: 28px; flex-wrap: wrap; font-size: 14px; }
.facts b { display: block; font-size: 22px; font-weight: 800; }
@media (min-width: 900px) { .home { grid-template-columns: 1.15fr 1fr; gap: 64px; padding-top: 48px; } }

/* results */
.rhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; margin-bottom: 28px; }
.rhead p { margin-top: 10px; color: var(--muted); max-width: 70ch; }
.code-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--tint); color: var(--accent-text);
  font-weight: 700; font-size: 14px; white-space: nowrap; }
.cards { display: grid; gap: 18px; align-items: start; }
@media (min-width: 1000px) { .cards { grid-template-columns: 1.08fr 1fr 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.card.top { border: 2px solid var(--green); box-shadow: var(--shadow); }
.band { padding: 10px 20px; font-weight: 700; font-size: 14px; background: var(--surface-2); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.card.top .band { background: var(--green); color: #fff; }
.cbody { padding: 20px 20px 22px; }
.cname { font-size: 21px; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; }
.cmeta { margin-top: 4px; color: var(--muted); font-size: 14px; }
.score { margin-top: 16px; display: flex; align-items: baseline; gap: 6px; }
.score b { font-size: 30px; font-weight: 800; color: var(--accent-text); line-height: 1; }
.score .of { color: var(--muted); font-weight: 600; }
.score .lbl { margin-right: 4px; font-weight: 600; font-size: 14px; color: var(--muted); }
.attrs { margin: 18px 0 4px; display: grid; gap: 11px; }
.attr { display: grid; grid-template-columns: 84px 1fr 30px; align-items: center; gap: 12px; font-size: 14px; }
.attr .v { text-align: right; font-weight: 700; }
.line { position: relative; height: 10px; }
.line::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: var(--line); border-radius: 2px; }
.line .fill { position: absolute; left: 0; top: 4px; height: 2px; background: var(--green); border-radius: 2px; }
.line .knot { position: absolute; top: 0; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--green); }
.pts { list-style: none; margin: 18px 0 0; padding: 16px 0 0; border-top: 1px solid var(--line); display: grid; gap: 10px; font-size: 14.5px; }
.pts li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; }
.pts .ok svg { color: var(--accent-text); }
.pts .warn svg { color: var(--warn); }
.pts .note { color: var(--muted); font-size: 13.5px; }
details.lab { margin-top: 14px; border-top: 1px solid var(--line); }
details.lab summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; min-height: 48px;
  font-weight: 600; font-size: 14px; color: var(--accent-text); }
details.lab summary::-webkit-details-marker { display: none; }
details.lab summary svg { transition: transform .15s; }
details.lab[open] summary svg { transform: rotate(180deg); }
.labgrid { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; padding-bottom: 8px; }
.labgrid dt { color: var(--muted); } .labgrid dd { margin: 0; font-weight: 600; text-align: right; }
.cfoot { padding: 0 20px 20px; }
.ralt { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-radius: var(--r-lg); background: var(--surface-2); }
.ralt .grp { display: flex; flex-wrap: wrap; gap: 4px; }
.src { margin-top: 22px; font-size: 13px; color: var(--muted); }

/* preview */
.pv { display: grid; gap: 32px; align-items: start; }
@media (min-width: 900px) { .pv { grid-template-columns: auto 1fr; gap: 56px; } }
.paper-wrap { background: var(--surface-2); border-radius: var(--r-lg); padding: 28px; display: flex; justify-content: center; }
.paper { width: 250px; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.12); border-radius: 2px; }
.paper iframe { display: block; width: 100%; border: 0; height: 600px; }
.pv-side h1 { margin-top: 6px; }
.pv-side .lead { margin-top: 12px; color: var(--muted); max-width: 48ch; }
.sum { margin-top: 24px; border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 6px; }
.sum .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.sum .val { font-weight: 700; }
.pv-actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }

/* done */
.done { text-align: center; padding-top: 32px; }
.okc { width: 76px; height: 76px; margin: 0 auto 24px; border-radius: 50%; background: var(--tint); color: var(--accent-text); display: grid; place-items: center; }
.okc svg { width: 38px; height: 38px; stroke-width: 2.5; }
.done .lead { margin: 12px auto 0; color: var(--muted); max-width: 44ch; }
.codebox { margin: 28px auto 0; display: inline-block; padding: 18px 28px; border-radius: var(--r-lg); border: 1.5px dashed var(--tint-3); }
.codebox .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.codebox .c { font-size: 40px; font-weight: 800; letter-spacing: .08em; color: var(--accent-text); line-height: 1.15; }
.done .acts { margin-top: 32px; display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
.countdown { margin-top: 18px; font-size: 14px; color: var(--muted); }
.proto-note { margin-top: 28px; font-size: 13px; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<script>/**
 * Tirtonic String Finder — reference engine (JavaScript, tanpa dependensi, tanpa LLM).
 * Implementasi acuan untuk Claude Code. Versi produksi boleh ditulis ulang di TypeScript,
 * tetapi WAJIB menghasilkan output yang sama dengan test-cases.json.
 *
 * Input : strings.json (data TWU yang sudah dibersihkan), rules.json, jawaban customer.
 * Output: 3 rekomendasi + skor + alasan berbasis angka.

(function (root) {
  const TEN = [40, 51, 62], SW = ['S', 'M', 'F'];
  const CONDITIONS = TEN.flatMap(t => SW.map(s => t + s));      // '40S' ... '62F'

  const ATTRS = ['spin', 'power', 'control', 'comfort', 'stability', 'durability'];
  const SWING_LABEL = { S: 'lambat', M: 'sedang', F: 'cepat' };

  // Persentil 0–100 (0 = nilai terendah, 100 = tertinggi). Nilai null diabaikan. Nilai seri dapat rata-rata posisi.
  function percentileRank(values) {
    const idx = values.map((v, i) => [v, i]).filter(x => x[0] != null).sort((a, b) => a[0] - b[0]);
    const out = new Array(values.length).fill(null), n = idx.length;
    let i = 0;
    while (i < n) {
      let j = i; while (j + 1 < n && idx[j + 1][0] === idx[i][0]) j++;
      const p = n > 1 ? ((i + j) / 2) / (n - 1) * 100 : 50;
      for (let k = i; k <= j; k++) out[idx[k][1]] = p;
      i = j + 1;
    }
    return out;
  }

  // Dijalankan sekali saat data dimuat (bisa di-cache).
  function prepare(data) {
    const pct = {};
    for (const c of CONDITIONS) { pct[c] = {}; for (const m of METRICS) pct[c][m] = percentileRank(data.slices[c][m]); }
    const gaugePct = percentileRank(data.strings.map(s => s.g));
    // Urutan kondisi pengganti bila data kondisi customer tidak ada:
    // jarak terdekat (selisih indeks tensi + selisih indeks swing); jika seri, 51F didahulukan.
    const fallbackOrder = {};
    for (const c of CONDITIONS) {
      const ti = TEN.indexOf(+c.slice(0, 2)), si = SW.indexOf(c[2]);
      const dist = x => Math.abs(TEN.indexOf(+x.slice(0, 2)) - ti) + Math.abs(SW.indexOf(x[2]) - si);
      fallbackOrder[c] = CONDITIONS.slice().sort((a, b) => dist(a) - dist(b) || (a === '51F' ? -1 : b === '51F' ? 1 : 0));
    }
    return { data, pct, gaugePct, fallbackOrder };
  }

  // Jawaban customer -> bobot, filter keras, kondisi data.
  function buildPlan(answers, rules) {
    const w = { ...rules.base_weights };
    const add = obj => { for (const k in obj || {}) w[k] = Math.max(0, w[k] + obj[k]); };
    (answers.priorities || []).forEach((p, i) => { w[p] += rules.priority_bonus[i] || 0; });
    for (const q of ['level', 'swing', 'arm', 'change', 'breakage']) add((rules.adjustments[q] || {})[answers[q]]);
    const total = ATTRS.reduce((s, k) => s + w[k], 0);
    const weights = Object.fromEntries(ATTRS.map(k => [k, w[k] / total]));
    const filters = [];
    for (const f of rules.hard_filters) {
      const hit = f.when_any.find(cond => Object.entries(cond).every(([k, v]) => answers[k] === v));
      if (hit) { const key = Object.entries(hit)[0].join('='); filters.push({ exclude_material: f.exclude_material, reason: f.reason[key] || key }); }
    }
    const swing = rules.condition_map.swing[answers.swing] || 'M';
    const tension = rules.condition_map.tension[answers.tension] || 51;
    return { weights, filters, condition: tension + swing, priorities: answers.priorities || [] };
  }

  function metric(P, i, m, condition) {
    for (const c of P.fallbackOrder[condition]) {
      const p = P.pct[c][m][i];
      if (p != null) return { p, raw: P.data.slices[c][m][i], condition: c, exact: c === condition };
    }
    return null;
  }

  // Rumus atribut (semua skala 0–100, makin tinggi makin baik untuk atribut itu).
  function attributes(M, gaugeP) {
    return {
      spin: M.sp ? M.sp.p : null,                                                         // spin potential tinggi
      control: M.st ? M.st.p : null,                                                      // lebih kaku = lebih terkontrol
      comfort: M.st ? (M.dw ? 0.7 * (100 - M.st.p) + 0.3 * M.dw.p : 100 - M.st.p) : null, // lembut + dwell time panjang
      power: M.st && M.er ? 0.5 * M.er.p + 0.5 * (100 - M.st.p) : null,                   // energy return tinggi + lembut
      stability: M.tl ? 100 - M.tl.p : null,                                              // tension loss rendah
      durability: gaugeP                                                                  // gauge lebih tebal

  }

  function scoreAll(P, answers, rules) {
    const plan = buildPlan(answers, rules);
    const excluded = new Set(plan.filters.map(f => f.exclude_material));
    const neutral = rules.selection.neutral_percentile_for_missing;
    const stats = { total: P.data.strings.length, filtered_material: 0, missing_priority_data: 0, limited_coverage: 0 };
    const ranked = [];
    P.data.strings.forEach((s, i) => {
      if (excluded.has(s.m) || (excluded.size && rules.exclude_unknown_material_when_filtering && s.m === 'Tidak diketahui')) { stats.filtered_material++; return; }

      if (plan.priorities.some(p => A[p] == null)) { stats.missing_priority_data++; return; }

      ranked.push({ index: i, string: s, metrics: M, attrs: A, score, exact, gaugePct: P.gaugePct[i] });
    });

    return { plan, ranked, stats };
  }

  function onePerFamily(ranked) {
    const seen = new Set(), out = [];
    for (const r of ranked) { if (seen.has(r.string.f)) continue; seen.add(r.string.f); out.push(r); }
    return out;
  }

  // FASE 1: 3 senar dengan skor tertinggi, masing-masing dari keluarga senar berbeda.
  function recommend(P, answers, rules) {
    const res = scoreAll(P, answers, rules);
    const pool = rules.selection.one_per_family ? onePerFamily(res.ranked) : res.ranked;
    res.picks = pool.slice(0, rules.selection.top_n).map(r => ({ ...r, explanation: explain(r, res.plan) }));
    return res;
  }

  // FASE 2: dari kelompok "cocok", pilih Terlaris, Premium (termahal), Paling hemat (termurah).
  // products: { [nama senar TWU]: { price_per_set, sold_90d, in_stock } }
  function recommendPhase2(P, answers, rules, products) {
    const res = scoreAll(P, answers, rules);
    const cfg = rules.phase2;
    const avail = onePerFamily(res.ranked.filter(r => products[r.string.n] && products[r.string.n].in_stock));
    res.phase2 = selectPhase2(avail.map(r => ({ ...r, product: products[r.string.n] })), cfg);
    res.phase2.picks.forEach(p => { p.explanation = explain(p, res.plan); });

  // Terpisah supaya bisa dites dengan data sintetis. items sudah terurut skor turun & sudah 1 per keluarga.
  function selectPhase2(items, cfg) {
    if (!items.length) return { picks: [], best_match: null, threshold: null };
    const top = items[0].score;
    let t = cfg.pool_threshold, pool = items.filter(x => x.score >= t * top);
    while (pool.length < 3 && t - cfg.pool_step >= cfg.pool_floor - 1e-9) { t -= cfg.pool_step; pool = items.filter(x => x.score >= t * top); }
    const left = pool.slice(), picks = [];
    const take = (label, cmp) => {
      if (!left.length) return;
      left.sort((a, b) => cmp(a, b) || b.score - a.score);
      picks.push({ ...left.shift(), label });
    };
    take(cfg.labels.bestseller, (a, b) => b.product.sold_90d - a.product.sold_90d);
    take(cfg.labels.premium, (a, b) => b.product.price_per_set - a.product.price_per_set);
    take(cfg.labels.budget, (a, b) => a.product.price_per_set - b.product.price_per_set);
    const bestMatch = pool[0];
    return { picks, best_match: picks.some(p => p.string.n === bestMatch.string.n) ? null : bestMatch, threshold: +t.toFixed(2) };
  }

  // ---- Penjelasan berbasis angka (template, bukan AI) ----
  const fmt = (x, d = 1) => (Math.round(x * 10 ** d) / 10 ** d).toString().replace('.', ',');
  const r0 = x => Math.min(99, Math.max(1, Math.round(x))); // hindari "lebih ... dari 100% senar"

  function strengthText(k, r, others = []) {
    const M = r.metrics;
    switch (k) {
      case 'spin': return `Potensi spin lebih tinggi dari ${r0(M.sp.p)}% senar yang diuji (nilai ${fmt(M.sp.raw)}).`;
      case 'comfort': return `Lebih lembut dari ${r0(100 - M.st.p)}% senar yang diuji (stiffness ${fmt(M.st.raw, 0)} lb/in).`;
      case 'control': return `Lebih kaku dari ${r0(M.st.p)}% senar, jadi arah bola lebih mudah dijaga (stiffness ${fmt(M.st.raw, 0)} lb/in).`;
      case 'power': return (M.er.p >= 100 - M.st.p || others.includes('comfort'))
        ? `Mengembalikan energi lebih baik dari ${r0(M.er.p)}% senar (energy return ${fmt(M.er.raw)}%).`
        : `Lentur (lebih lembut dari ${r0(100 - M.st.p)}% senar), membantu bola melaju lebih jauh.`;
      case 'stability': return `Tensinya lebih awet dari ${r0(100 - M.tl.p)}% senar (tension loss ${fmt(M.tl.raw)}%).`;
      case 'durability': return `Lebih tebal dari ${r0(r.gaugePct)}% senar (${fmt(r.string.g, 2)} mm), jadi lebih tahan putus.`;
    }
  }
  function weaknessText(k, r) {
    const M = r.metrics;
    switch (k) {
      case 'spin': return `Potensi spin di bawah rata-rata (lebih rendah dari ${r0(100 - M.sp.p)}% senar).`;
      case 'comfort': return `Cukup kaku (lebih kaku dari ${r0(M.st.p)}% senar). Perhatikan kalau lengan mudah pegal.`;
      case 'control': return `Senarnya lembut, jadi bola cenderung melaju lebih jauh dan butuh kontrol dari ayunan.`;
      case 'power': return `Power di bawah rata-rata; kedalaman bola lebih banyak bergantung pada ayunan Anda.`;
      case 'stability': return `Tensi turun cukup cepat (tension loss ${fmt(M.tl.raw)}%), sebaiknya diganti lebih rutin.`;
      case 'durability': return `Gauge tipis (${fmt(r.string.g, 2)} mm), lebih cepat putus kalau sering topspin.`;
    }
  }

  function explain(r, plan) {
    const A = r.attrs, W = plan.weights;
    const cand = ATTRS.filter(k => A[k] != null && W[k] >= 0.10).sort((a, b) => W[b] * A[b] - W[a] * A[a]);
    let strengths = cand.filter(k => A[k] >= 60).slice(0, 2);
    if (!strengths.length && cand.length) strengths = [cand.slice().sort((a, b) => A[b] - A[a])[0]];
    const weakCand = ATTRS.filter(k => A[k] != null && A[k] < 35 && !strengths.includes(k) && (k !== 'durability' || W[k] >= 0.10))
      .sort((a, b) => Math.max(W[b], 0.05) * (50 - A[b]) - Math.max(W[a], 0.05) * (50 - A[a]));
    const notes = [];
    const nonExact = ['st', 'tl', 'sp', 'er', 'dw'].map(m => r.metrics[m]).filter(x => x && !x.exact);
    if (nonExact.length) {
      const c = nonExact[0].condition;
      notes.push(`Data lab untuk tensi dan ayunan Anda belum tersedia; dihitung dari pengujian ${c.slice(0, 2)} lbs, swing ${SWING_LABEL[c[2]]}.`);
    }
    if (!r.metrics.sp) notes.push('Potensi spin senar ini tidak diukur di data lab.');
    return {
      strengths: strengths.map(k => ({ attr: k, text: strengthText(k, r, strengths) })),
      weakness: weakCand.length ? { attr: weakCand[0], text: weaknessText(weakCand[0], r) }
                                : { attr: null, text: 'Tidak ada kelemahan menonjol untuk kebutuhan Anda.' },
      notes
    };
  }

  root.StringFinder = { prepare, buildPlan, scoreAll, recommend, recommendPhase2, selectPhase2, explain, ATTRS, CONDITIONS };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/**
 * Resep stringing (slip printer thermal) — implementasi acuan.
 * buildSlip(): data terstruktur (deterministik). renderSlipHTML(): template cetak 58/80 mm untuk browser print.
 * Butuh engine.js (StringFinder) sudah dimuat.
 */
(function (root) {
  const LABEL = {
    level: { pemula: 'Baru mulai', rutin: 'Rutin (rekreasi)', kompetitif: 'Kompetitif' },
    swing: { santai: 'Santai, pendek', sedang: 'Sedang', cepat: 'Penuh, cepat' },
    priorities: { spin: 'Spin', power: 'Power', control: 'Kontrol', comfort: 'Nyaman' },
    arm: { tidak: 'Tidak ada keluhan', pegal: 'Kadang pegal', cedera: 'Sedang cedera' },
    change: { cepat: '< 1 bulan', sedang: '1-3 bulan', lama: '> 3 bulan' },
    breakage: { sering: 'Sering', kadang: 'Kadang', tidak: 'Tidak pernah' },
    tension: { rendah: '< 48 lbs', sedang: '48-55 lbs', tinggi: '> 55 lbs', tidaktahu: 'Tidak tahu' }
  };
  const ATTR_LABEL = { spin: 'Spin', power: 'Power', control: 'Kontrol', comfort: 'Nyaman', stability: 'Tensi awet', durability: 'Tahan putus' };
  const fmt = (x, d = 2) => (Math.round(x * 10 ** d) / 10 ** d).toFixed(d).replace('.', ',');

  // Kode resep pendek & mudah dibaca. Produksi: pastikan unik (cek DB, ulangi bila bentrok).
  function makeCode(rules, rand = Math.random) {
    const s = rules.slip, a = s.code_alphabet;
    let c = ''; for (let i = 0; i < s.code_length; i++) c += a[Math.floor(rand() * a.length)];
    return s.code_prefix + c;
  }

  function pickFlags(rules, answers, pick) {
    return rules.slip.flags.filter(f => {
      if (f.when && !Object.entries(f.when).every(([k, v]) => answers[k] === v)) return false;
      const w = f.when_pick; if (!w) return true;
      if (w.stability_below != null && !(pick.attrs.stability != null && pick.attrs.stability < w.stability_below)) return false;
      if (w.gauge_below != null && !(pick.string.g != null && pick.string.g < w.gauge_below)) return false;
      if (w.estimated && pick.exact) return false;
      return true;
    }).map(f => f.text);
  }

  /**
   * result  : output StringFinder.recommend()
   * answers : jawaban customer
   * opts    : { code, createdAt (Date), branch, chosenRank (1|2|3|null = cetak ketiganya), qrUrl, paper }
   */
  function buildSlip(result, answers, rules, opts) {
    const picks = result.picks;
    const chosen = opts.chosenRank ? picks[opts.chosenRank - 1] : null;
    // Sorotan = nilai atribut prioritas customer (urut prioritas). Tanpa prioritas: 2 atribut tertinggi berbobot >= 10%.
    const pr = result.plan.priorities || [];
    const top2 = p => (pr.length ? pr.map(k => [k, p.attrs[k]]).filter(([, v]) => v != null)
      : Object.entries(p.attrs).filter(([k, v]) => v != null && result.plan.weights[k] >= 0.10).sort((a, b) => b[1] - a[1]).slice(0, 2))
      .map(([k, v]) => `${ATTR_LABEL[k]} ${Math.round(v)}`).join(', ');
    const item = (p, i) => ({ rank: i + 1, name: p.string.n, material: p.string.m, gauge_mm: p.string.g,
      score: Math.round(p.score), highlights: top2(p) });
    const flagSource = chosen ? [chosen] : picks;
    const flags = [...new Set(flagSource.flatMap(p => pickFlags(rules, answers, p)))];
    return {
      code: opts.code, created_at: opts.createdAt.toISOString(), branch: opts.branch, paper: opts.paper || rules.slip.paper_default,
      mode: chosen ? 'single' : 'all',
      chosen: chosen ? item(chosen, opts.chosenRank - 1) : null,
      options: chosen ? picks.map(item).filter(x => x.rank !== opts.chosenRank) : picks.map(item),
      tension_usual: LABEL.tension[answers.tension],
      profile: [
        ['Level', LABEL.level[answers.level]], ['Ayunan', LABEL.swing[answers.swing]],
        ['Prioritas', (answers.priorities || []).map((p, i) => `${i + 1} ${LABEL.priorities[p]}`).join(', ')],
        ['Lengan', LABEL.arm[answers.arm]], ['Ganti senar', LABEL.change[answers.change]], ['Senar putus', LABEL.breakage[answers.breakage]]
      ],
      flags,
      handwritten: rules.slip.handwritten_fields,
      qr_url: opts.qrUrl
    };
  }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function renderSlipHTML(slip, qrSvg = '') {
    const w = slip.paper === '80' ? 72 : 48; // lebar area cetak (mm)
    const d = new Date(slip.created_at);
    const pad = n => String(n).padStart(2, '0');
    const when = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const str = (x, big) => `<div class="${big ? 'name big' : 'name'}">${x.rank}. ${esc(x.name)}</div>
      <div class="meta">${esc(x.material)}, ${x.gauge_mm ? fmt(x.gauge_mm) + ' mm' : 'gauge ?'} | Cocok ${x.score}/100</div>
      ${x.highlights ? `<div class="meta">${esc(x.highlights)}</div>` : ''}`;
    return `<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Resep ${esc(slip.code)}</title><style>
@page { size: ${slip.paper}mm auto; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: ${w}mm; margin: 0 auto; padding: 2mm 0 6mm; font: 9pt/1.3 Arial, "Helvetica Neue", sans-serif; color: #000; background: #fff; }
.c { text-align: center; } .shop { font-weight: 700; font-size: 11pt; } .title { font-size: 10pt; }
.code { font-weight: 700; font-size: 16pt; letter-spacing: 1px; margin: 1mm 0; }
hr { border: 0; border-top: 1px dashed #000; margin: 2mm 0; }
h2 { font-size: 9pt; font-weight: 700; margin-bottom: 1mm; }
.name { font-weight: 700; font-size: 10pt; } .name.big { font-size: 12pt; } .meta { font-size: 8.5pt; }
.opt { margin-top: 1.5mm; }
table { width: 100%; border-collapse: collapse; font-size: 8.5pt; } td { vertical-align: top; padding: 0.3mm 0; } td:first-child { width: 42%; }
.blank { display: flex; align-items: flex-end; gap: 1.5mm; margin-top: 2.6mm; font-size: 9pt; } .line { flex: 1; border-bottom: 1px solid #000; min-height: 1em; }
.big-blank { font-size: 11pt; font-weight: 700; }
ul { padding-left: 3.5mm; font-size: 8.5pt; } li { margin-bottom: 0.8mm; }
.qr { display: flex; justify-content: center; margin-top: 2mm; } .qr svg { width: 22mm; height: 22mm; }
.foot { font-size: 7pt; margin-top: 1.5mm; }
</style></head><body>
<div class="c"><div class="shop">TIRTONIC TENNIS STORE</div><div class="title">Resep Senar</div>
<div class="code">${esc(slip.code)}</div><div class="meta">${when} | ${esc(slip.branch)}</div></div>
<hr>
${slip.mode === 'single'
  ? `<h2>Senar pilihan customer</h2>${str(slip.chosen, true)}`
  : `<h2>Pilihan senar (lingkari yang dipakai)</h2>${slip.options.map((o, i) => `<div class="${i ? 'opt' : ''}">${str(o, i === 0)}</div>`).join('')}`}
<hr>
<h2>Tensi</h2>
<div class="meta">Biasa dipakai customer: ${esc(slip.tension_usual)}</div>
<div class="blank big-blank"><span>Tensi final</span><span class="line"></span><span>lbs</span></div>
<div class="blank"><span>Mains</span><span class="line"></span><span>Crosses</span><span class="line"></span></div>
<hr>
<h2>Profil pemain</h2>
<table>${slip.profile.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>
${slip.flags.length ? `<hr><h2>Perhatian stringer</h2><ul>${slip.flags.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
${slip.mode === 'single' && slip.options.length ? `<hr><h2>Alternatif</h2>${slip.options.map(o => `<div class="meta">${o.rank}. ${esc(o.name)}, cocok ${o.score}</div>`).join('')}` : ''}
<hr>
${slip.handwritten.map(f => `<div class="blank"><span>${esc(f)}</span><span class="line"></span></div>`).join('')}
${qrSvg ? `<div class="qr">${qrSvg}</div>` : ''}
<div class="c foot">Data lab: Tennis Warehouse University</div>
</body></html>`;
  }

  root.StringSlip = { buildSlip, renderSlipHTML, makeCode, LABEL };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

          <span class="code-chip">Kode resep <span class="num">${esc(S.code)}</span></span>
        </div>
        ${picks.length ? `<div class="cards">${picks.map((p, i) => card(p, i)).join('')}</div>` :
          `<p class="muted">Belum ada senar yang cocok dengan kombinasi jawaban ini. Ubah jawaban atau tanyakan langsung ke stringer kami.</p>`}
        <div class="ralt">
          ${picks.length > 1 ? `<button class="btn btn-ghost" data-act="printall">${icon.printer}Belum yakin? Cetak ketiganya</button>` : '<span></span>'}
          <div class="grp"><button class="btn btn-ghost" data-act="edit">Ubah jawaban</button><button class="btn btn-ghost" data-act="restart">Mulai lagi</button></div>
        </div>
        <p class="src">Data lab: Tennis Warehouse University String Performance Database. Skor dihitung dengan aturan toko, tanpa AI.</p>
      </main>`;
    },

    preview: () => {
      const p = S.chosen ? S.result.picks[S.chosen - 1] : null;
      return `${header()}
      <main class="wrap screen"><div class="pv">
        <div class="paper-wrap"><div class="paper"><iframe title="Pratinjau resep" id="slipframe"></iframe></div></div>
        <div class="pv-side">
          <button class="back" data-act="toresults" style="margin-left:-6px">${icon.back}Kembali ke hasil</button>
          <h1 class="title">Periksa resep sebelum dicetak</h1>
          <p class="lead">Resep ini akan keluar di printer meja stringer cabang ${esc(branch())}. Serahkan kertasnya ke stringer untuk dipasang.</p>
          <div class="sum">
            <span class="k">${p ? 'Senar pilihan' : 'Pilihan senar'}</span>
            <span class="val">${p ? esc(p.string.n) : 'Ketiga rekomendasi, stringer membantu memilih'}</span>
            <span class="k" style="margin-top:8px">Kode resep</span><span class="val num">${esc(S.code)}</span>
          </div>
          <div class="pv-actions"><button class="btn btn-primary btn-lg" data-act="print">${icon.printer}Cetak resep</button></div>
        </div>
      </div></main>`;
    },

    done: () => `${header()}
      <main class="wrap narrow screen"><div class="done">
        <div class="okc">${icon.check}</div>
        <h1 class="title">Resep sedang dicetak</h1>
        <p class="lead">Ambil kertasnya di meja stringer, lalu serahkan ke stringer kami.</p>
        <div class="codebox"><div class="k">Kode resep</div><div class="c num">${esc(S.code)}</div></div>
        <p class="muted small" style="margin-top:14px">Kalau kertas belum keluar, sebutkan kode ini ke stringer.</p>
        <div class="acts"><button class="btn btn-primary btn-lg" data-act="finish">Selesai</button>
          <button class="btn btn-outline btn-lg" data-act="localprint">${icon.printer}Cetak di perangkat ini</button></div>
        <p class="countdown" id="cd">Kembali ke halaman awal dalam ${DONE_RESET_S} detik.</p>
        <p class="proto-note">Prototipe: pengiriman ke printer stasiun disimulasikan. Tombol "Cetak di perangkat ini" membuka dialog cetak browser.</p>
      </div></main>`
  };

  // ---------- pieces ----------
  const ATTR_ROWS = [['spin', 'Spin'], ['power', 'Power'], ['control', 'Kontrol'], ['comfort', 'Nyaman'], ['stability', 'Tensi awet']];
  function card(p, i) {
    const e = p.explanation, M = p.metrics, g = p.string.g;
    const lab = [['Stiffness', M.st && `${fmt(M.st.raw, 0)} lb/in`], ['Tension loss', M.tl && `${fmt(M.tl.raw)}%`],
      ['Energy return', M.er && `${fmt(M.er.raw)}%`], ['Dwell time', M.dw && `${fmt(M.dw.raw)} ms`], ['Spin potential', M.sp && fmt(M.sp.raw)],
      ['Kondisi data', M.st && `${M.st.condition.slice(0, 2)} lbs, swing ${({ S: 'lambat', M: 'sedang', F: 'cepat' })[M.st.condition[2]]}`]];
    return `<article class="card ${i === 0 ? 'top' : ''}" aria-labelledby="c${i}">
      <div class="band">${i === 0 ? `${icon.check}Paling cocok` : `Alternatif ${i + 1}`}</div>
      <div class="cbody">
        <h2 class="cname" id="c${i}">${esc(p.string.n)}</h2>
        <p class="cmeta">${esc(p.string.m)}${g ? `, ${g.toFixed(2).replace('.', ',')} mm` : ''}</p>
        <div class="score"><span class="lbl">Kecocokan</span><b class="num">${Math.round(p.score)}</b><span class="of">/100</span></div>
        <div class="attrs">${ATTR_ROWS.map(([k, l]) => {
          const v = p.attrs[k];
          return `<div class="attr"><span>${l}</span>
            <span class="line" role="img" aria-label="${l} ${v == null ? 'tidak ada data' : Math.round(v) + ' dari 100'}">${v == null ? '' :
              `<span class="fill" style="width:${v}%"></span><span class="knot" style="left:${v}%"></span>`}</span>
            <span class="v num">${v == null ? '-' : Math.round(v)}</span></div>`;
        }).join('')}</div>
        <ul class="pts">
          ${e.strengths.map(s => `<li class="ok">${icon.check}<span>${esc(s.text)}</span></li>`).join('')}
          ${e.weakness.attr ? `<li class="warn">${icon.alert}<span>${esc(e.weakness.text)}</span></li>` : ''}
          ${e.notes.map(n => `<li class="note">${icon.info}<span>${esc(n)}</span></li>`).join('')}
        </ul>
        <details class="lab"><summary>Lihat data lab ${icon.down}</summary>
          <dl class="labgrid">${lab.map(([k, v]) => `<dt>${k}</dt><dd class="num">${esc(v || 'tidak diukur')}</dd>`).join('')}</dl>
        </details>
      </div>
      <div class="cfoot"><button class="btn ${i === 0 ? 'btn-primary' : 'btn-outline'} btn-block" data-pick="${i + 1}">Pilih senar ini</button></div>
    </article>`;
  }

  function profileSentence(a) {
    const L = {
      level: { pemula: 'Baru mulai', rutin: 'Rutin main', kompetitif: 'Pemain kompetitif' },
      swing: { santai: 'ayunan santai', sedang: 'ayunan sedang', cepat: 'ayunan penuh dan cepat' },
      p: { spin: 'spin', power: 'power', control: 'kontrol', comfort: 'kenyamanan' },
      arm: { tidak: 'tanpa keluhan lengan', pegal: 'lengan kadang pegal', cedera: 'sedang cedera lengan' },
      change: { cepat: 'ganti senar kurang dari sebulan sekali', sedang: 'ganti senar tiap 1 sampai 3 bulan', lama: 'ganti senar lebih dari 3 bulan sekali' },
      breakage: { sering: 'senar sering putus', kadang: 'senar kadang putus', tidak: 'senar tidak pernah putus' },
      tension: { rendah: 'tensi di bawah 48 lbs', sedang: 'tensi 48 sampai 55 lbs', tinggi: 'tensi di atas 55 lbs', tidaktahu: 'tensi belum diketahui' }
    };
    const pr = (a.priorities || []).map(x => L.p[x]);
    return [L.level[a.level], L.swing[a.swing], pr.length ? 'prioritas ' + pr.join(' lalu ') : null, L.arm[a.arm], L.change[a.change], L.breakage[a.breakage], L.tension[a.tension]]
      .filter(Boolean).join(', ') + '.';
  }

  function slipHTML() {
    const slip = StringSlip.buildSlip(S.result, S.answers, RULES,
      { code: S.code, createdAt: new Date(), branch: branch(), chosenRank: S.chosen, qrUrl: '', paper: '58' });
    return StringSlip.renderSlipHTML(slip, '').replace('</style>', 'html,body{overflow:hidden}</style>');
  }

  // ---------- render & events ----------
  function render() {
    if (!loggedIn()) S.screen = 'login';
    else if (!branch() && S.screen !== 'branch') S.screen = 'branch';
    $app.innerHTML = screens[S.screen]();
    if (S.screen === 'preview') {
      const f = document.getElementById('slipframe');
      f.addEventListener('load', () => { try { f.style.height = f.contentDocument.documentElement.scrollHeight + 'px'; } catch (e) {} });
      f.srcdoc = slipHTML();
    }
    if (S.screen === 'done') {
      let s = DONE_RESET_S; const cd = document.getElementById('cd');
      S.timer = setInterval(() => { s--; if (cd) cd.textContent = `Kembali ke halaman awal dalam ${s} detik.`; if (s <= 0) finish(); }, 1000);
    }
    if (S.screen === 'login') setTimeout(() => { const i = document.getElementById('pw'); if (i) i.focus(); }, 30);
  }

  function finish() { go('home', { answers: {}, step: 0, result: null, code: null, chosen: null }); }

  function compute() {
    S.result = StringFinder.recommend(P, S.answers, RULES);
    S.code = StringSlip.makeCode(RULES);
    go('results'); say(`${S.result.picks.length} rekomendasi siap. Kode resep ${S.code}.`);
  }

  function nextStep() { if (S.step < Q.length - 1) go('question', { step: S.step + 1 }); else compute(); }

  $app.addEventListener('submit', ev => {
    if (ev.target.dataset.form !== 'login') return;
    ev.preventDefault();
    const i = document.getElementById('pw'), err = document.getElementById('pw-err');
    if (i.value === DEMO_PASSWORD) { store.set('session', { exp: Date.now() + SESSION_DAYS * 864e5 }); go(branch() ? 'home' : 'branch'); }
    else { i.setAttribute('aria-invalid', 'true'); err.textContent = i.value ? 'Password salah. Coba lagi.' : 'Masukkan password.'; i.select(); }
  });

  $app.addEventListener('click', ev => {
    const t = ev.target.closest('button'); if (!t) return;
    const act = t.dataset.act;
    if (t.dataset.branch) { store.set('branch', t.dataset.branch); say('Cabang ' + t.dataset.branch + ' dipilih.'); setTimeout(() => go('home'), 160); t.setAttribute('aria-pressed', 'true'); return; }
    if (t.dataset.opt) {
      const q = Q[S.step];
      if (q.type === 'multi') {
        const cur = (S.answers[q.id] || []).slice(), k = cur.indexOf(t.dataset.opt);
        if (k >= 0) cur.splice(k, 1); else if (cur.length < (q.max || 2)) cur.push(t.dataset.opt);
        S.answers[q.id] = cur; render();
      } else {
        S.answers[q.id] = t.dataset.opt;
        $app.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
        t.querySelector('.mark').innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
        setTimeout(nextStep, 240);
      }
      return;
    }
    if (t.dataset.pick) { go('preview', { chosen: +t.dataset.pick }); return; }
    switch (act) {
      case 'togglepw': { const i = document.getElementById('pw'); const show = i.type === 'password'; i.type = show ? 'text' : 'password';
        t.innerHTML = show ? icon.eyeOff : icon.eye; t.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password'); i.focus(); break; }
      case 'logout': store.del('session'); go('login', { answers: {}, step: 0 }); break;
      case 'branch': go('branch'); break;
      case 'start': go('question', { step: 0, answers: {} }); break;
      case 'qback': if (S.step) go('question', { step: S.step - 1 }); else go('home'); break;
      case 'qnext': nextStep(); break;
      case 'edit': go('question', { step: 0 }); break;
      case 'restart': finish(); break;
      case 'printall': go('preview', { chosen: null }); break;
      case 'toresults': go('results'); break;
      case 'print': go('done'); say('Resep dikirim ke printer.'); break;
      case 'finish': finish(); break;
      case 'localprint': {
        const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0';
        document.body.appendChild(f); f.srcdoc = slipHTML();
        f.onload = () => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { alert('Cetak dari perangkat ini tidak diizinkan di tampilan ini.'); } setTimeout(() => f.remove(), 60000); };
        break; }
    }
  });

  S.screen = loggedIn() ? (branch() ? 'home' : 'branch') : 'login';
  render();
})();
</script>
</body>
</html>
